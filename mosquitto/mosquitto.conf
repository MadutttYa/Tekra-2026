# =============================================================================
# Mosquitto MQTT Broker Configuration
# =============================================================================

# Port to listen on for incoming MQTT connections
listener 1883 0.0.0.0

# Allow connections without username/password (fine for development)
allow_anonymous true

# -----------------------------------------------------------------------------
# Persistence
# Save messages and subscriptions to disk so they survive container restarts
# -----------------------------------------------------------------------------
persistence true
persistence_location /mosquitto/data/

# -----------------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------------
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
