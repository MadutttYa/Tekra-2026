# =============================================================================
# Telegraf Configuration — TEKRA Project
# Pipeline: Mosquitto (MQTT) --> Telegraf --> QuestDB
# =============================================================================

# -----------------------------------------------------------------------------
# Agent — global behaviour
# -----------------------------------------------------------------------------
[agent]
  interval        = "10s"
  flush_interval  = "10s"
  flush_jitter    = "2s"
  precision       = "1s"
  omit_hostname   = true

# =============================================================================
# INPUT — Subscribe to MQTT topics and read sensor payloads
# =============================================================================
[[inputs.mqtt_consumer]]
  servers            = ["tcp://mosquitto:1883"]
  topics             = [
    "tekra/room/+/telemetry",
    "tekra/wokwi/+/telemetry"
  ]
  qos                = 0
  client_id          = "telegraf-tekra"
  connection_timeout = "30s"
  data_format        = "json_v2"

  # ---------------------------------------------------------------------------
  # Topic parsing — extract source + room_id from the topic string as tags
  # Topic format : tekra / {source} / {room_id} / telemetry
  # "_" means ignore this segment
  # ---------------------------------------------------------------------------
  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "tekra/+/+/telemetry"
    tags  = "_/source/room_id/_"

  # ---------------------------------------------------------------------------
  # JSON v2 — explicitly map every payload field to a QuestDB column
  #
  # Why explicit fields instead of [[object]] blocks?
  # Using multiple [[object]] blocks creates separate metrics (separate rows).
  # Listing fields one by one guarantees everything lands in ONE row.
  #
  # measurement_name = TABLE NAME in QuestDB (auto-created on first write)
  # ---------------------------------------------------------------------------
  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "room_telemetry"
    timestamp_path   = "timestamp"
    timestamp_format = "RFC3339"

    # --- Tags (indexed metadata for filtering/grouping) ----------------------
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "device_id"

    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "building_id"

    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "room_id"

    # --- Root fields ---------------------------------------------------------
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "floor"
      type = "int"

    # --- Environment ---------------------------------------------------------
    [[inputs.mqtt_consumer.json_v2.field]]
      path   = "environment.temperature"
      rename = "temperature"
      type   = "float"

    [[inputs.mqtt_consumer.json_v2.field]]
      path   = "environment.humidity"
      rename = "humidity"
      type   = "float"

    [[inputs.mqtt_consumer.json_v2.field]]
      path   = "environment.heat_index"
      rename = "heat_index"
      type   = "float"

    [[inputs.mqtt_consumer.json_v2.field]]
      path   = "environment.air_quality"
      rename = "air_quality"
      type   = "float"

    [[inputs.mqtt_consumer.json_v2.field]]
      path   = "environment.lux"
      rename = "lux"
      type   = "float"

    [[inputs.mqtt_consumer.json_v2.field]]
      path   = "environment.comfort_score"
      rename = "comfort_score"
      type   = "float"

    # --- Power ---------------------------------------------------------------
    [[inputs.mqtt_consumer.json_v2.field]]
      path   = "power.voltage"
      rename = "voltage"
      type   = "float"

    [[inputs.mqtt_consumer.json_v2.field]]
      path   = "power.current"
      rename = "current"
      type   = "float"

    # Renamed to "power_w" — avoids collision with the word "power" in SQL contexts
    [[inputs.mqtt_consumer.json_v2.field]]
      path   = "power.power"
      rename = "power_w"
      type   = "float"

    [[inputs.mqtt_consumer.json_v2.field]]
      path   = "power.energy"
      rename = "energy"
      type   = "float"

    [[inputs.mqtt_consumer.json_v2.field]]
      path   = "power.frequency"
      rename = "frequency"
      type   = "float"

    [[inputs.mqtt_consumer.json_v2.field]]
      path   = "power.pf"
      rename = "pf"
      type   = "float"

    # --- Occupancy -----------------------------------------------------------
    [[inputs.mqtt_consumer.json_v2.field]]
      path   = "occupancy.pir_triggered"
      rename = "pir_triggered"
      type   = "bool"

    [[inputs.mqtt_consumer.json_v2.field]]
      path   = "occupancy.estimated_people"
      rename = "estimated_people"
      type   = "int"

    [[inputs.mqtt_consumer.json_v2.field]]
      path   = "occupancy.activity_score"
      rename = "activity_score"
      type   = "float"

    [[inputs.mqtt_consumer.json_v2.field]]
      path   = "occupancy.state"
      rename = "state"
      type   = "string"

# =============================================================================
# OUTPUT — Write to QuestDB via InfluxDB Line Protocol (TCP port 9009)
# =============================================================================
[[outputs.socket_writer]]
  address     = "tcp://questdb:9009"
  data_format = "influx"
